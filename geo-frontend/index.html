<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountryInfo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">

        <header>
            <nav>
                <a href="index.html">
                    <img class="logo" src="images/silouette.png" alt="CountryInfo logo" />
                </a>
                <button class="hamburger" id="hamburger" aria-label="Open navigation menu">
                    ☰
                </button>
                <ul class="continent-nav" id="continent-nav">
                    <li><a href="africa.html">Africa</a></li>
                    <li><a href="asia.html">Asia</a></li>
                    <li><a href="europe.html">Europe</a></li>
                    <li><a href="oceania.html">Oceania</a></li>
                    <li><a href="na.html">North America</a></li>
                    <li><a href="sa.html">South America</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-box">
            <h1>CountryInfo</h1>

            <p>Please reach out with any problems or suggestions.</p>

            <form class="search-form" id="search-form">
                <label for="search-box">Search countries</label>

                <div class="search-input">
                    <input id="search-box" type="search" placeholder="Search countries..." autocomplete="off">

                    <button type="submit">Search</button>
                </div>

                <div id="search-results" class="search-results"></div>
            </form>
        </main>

        <footer>
            <div class="footer-links">

                <div class="contact-us">
                    <h2>Contact Us</h2>
                    <span>mtmcrey@yahoo.com</span>
                    <span>@ShortGuyTye</span>
                </div>

                <div class="about">
                    <h2>
                        <a href="about.html">About</a>
                    </h2>
                    <span>Learn more about us</span>
                </div>

            </div>

            <p class="copyright">Made by Tye McReynolds</p>
        </footer>

    </div>

</body>

<script>
    const hamburger = document.getElementById("hamburger");
    const continentNav = document.getElementById("continent-nav");

    hamburger.addEventListener("click", function () {
        continentNav.classList.toggle("show");

        if (continentNav.classList.contains("show")) {
            hamburger.textContent = "✕";
            hamburger.setAttribute("aria-label", "Close navigation menu");
        } else {
            hamburger.textContent = "☰";
            hamburger.setAttribute("aria-label", "Open navigation menu");
        }
    });

    const searchForm = document.getElementById("search-form");
    const searchBox = document.getElementById("search-box");
    const searchResults = document.getElementById("search-results");

    let currentResults = [];

    searchBox.addEventListener("input", async function () {
        const search = searchBox.value.trim();

        if (!search) {
            searchResults.innerHTML = "";
            searchResults.classList.remove("show");
            currentResults = [];
            return;
        }

        try {
            const response = await fetch(
                `/countries/search/${encodeURIComponent(search)}`
            );

            if (!response.ok) {
                throw new Error(`HTTP error: ${response.status}`);
            }

            const countries = await response.json();

            currentResults = countries;
            searchResults.innerHTML = "";

            if (countries.length === 0) {
                searchResults.classList.remove("show");
                return;
            }

            countries.forEach(country => {
                const result = document.createElement("a");

                result.classList.add("search-result");
                result.textContent = country.name;
                result.href = `country.html?country=${country.abbreviation}`;

                searchResults.appendChild(result);
            });

            searchResults.classList.add("show");

        } catch (error) {
            console.error("Search error:", error);
            currentResults = [];
            searchResults.classList.remove("show");
        }
    });

    searchForm.addEventListener("submit", function (event) {
        event.preventDefault();

        if (currentResults.length === 0) {
            return;
        }

        const firstCountry = currentResults[0];

        window.location.href =
            `country.html?country=${firstCountry.abbreviation}`;
    });
</script>

</html>
